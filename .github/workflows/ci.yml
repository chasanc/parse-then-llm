name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w @parse-then-llm/api

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -w @parse-then-llm/api

  extractor-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [extractor-deterministic, extractor-llm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --directory services/${{ matrix.service }} pytest -q

  eval:
    runs-on: ubuntu-latest
    needs: [api-tests, extractor-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Create .env with a throwaway secret (mock LLM provider, no API key)
        run: |
          sed "s/^HMAC_SECRET=.*/HMAC_SECRET=$(openssl rand -hex 32)/" .env.example > .env
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "PTL_API_KEY=$key" >> .env
          echo "PTL_API_KEY=$key" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Wait for the API (compose only waits for the container to start)
        run: curl -sS -o /dev/null --retry 30 --retry-all-errors --retry-delay 1 http://localhost:3000/jobs/00000000-0000-0000-0000-000000000000
      - name: Offline eval
        run: eval/run_eval.py --out eval-report.md
      - name: Show the report
        if: always()
        run: cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: eval-report, path: eval-report.md }
